# Subject models, as Inspect model strings. Groups can be run separately
# (scripts/run_evals.py --group closed). All run with provider defaults for
# temperature and reasoning effort; the reasoning column records whether a
# model reasons before answering, which the analysis reports alongside results.
#
# Open-weights models go through OpenRouter. Routing is constrained so a model
# is only served by providers that (a) support every request parameter we send
# (tools), and (b) serve unquantized or fp8 weights, so results are not
# confounded by an int4 host being picked on one request and bf16 on the next.

openrouter_provider:
  require_parameters: true
  quantizations: [bf16, fp16, fp8]

groups:
  anthropic:
    - {model: anthropic/claude-opus-5-5, label: Claude Opus 5.5, family: Anthropic, reasoning: false}
    - {model: anthropic/claude-sonnet-5, label: Claude Sonnet 5, family: Anthropic, reasoning: false}
    - {model: anthropic/claude-haiku-4-5, label: Claude Haiku 4.5, family: Anthropic, reasoning: false}
  openai:
    - {model: openai/gpt-5.5, label: GPT-5.5, family: OpenAI, reasoning: true}
    - {model: openai/gpt-5-mini, label: GPT-5 mini, family: OpenAI, reasoning: true}
    - {model: openai/gpt-4.1-mini, label: GPT-4.1 mini, family: OpenAI, reasoning: false}
    - {model: openai/gpt-4o-mini, label: GPT-4o mini, family: OpenAI, reasoning: false}
  open:
    - {model: openrouter/qwen/qwen3-235b-a22b-2507, label: Qwen3 235B, family: Qwen, reasoning: false}
    - {model: openrouter/qwen/qwen-2.5-7b-instruct, label: Qwen2.5 7B, family: Qwen, reasoning: false}
    - {model: openrouter/meta-llama/llama-3.3-70b-instruct, label: Llama 3.3 70B, family: Meta, reasoning: false}
    - {model: openrouter/meta-llama/llama-3.1-8b-instruct, label: Llama 3.1 8B, family: Meta, reasoning: false}
    - {model: openrouter/deepseek/deepseek-v3.2, label: DeepSeek V3.2, family: DeepSeek, reasoning: false}
    - {model: openrouter/openai/gpt-oss-120b, label: gpt-oss-120b, family: OpenAI (open), reasoning: true}
    - {model: openrouter/mistralai/mistral-small-3.2-24b-instruct, label: Mistral Small 3.2, family: Mistral, reasoning: false}
