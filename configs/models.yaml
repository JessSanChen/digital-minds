# Subject models, as Inspect model strings. Groups can be run separately
# (scripts/run_evals.py --group closed). All run with provider defaults for
# temperature and reasoning effort; the reasoning column records whether a
# model reasons before answering, which the analysis reports alongside results.
#
# Open-weights models go through OpenRouter. Routing (for the `open` group only) is constrained so a model
# is only served by providers that (a) support every request parameter we send
# (tools), and (b) serve unquantized or fp8 weights, so results are not
# confounded by an int4 host being picked on one request and bf16 on the next.

# Closed models also list their OpenRouter id, so the whole registry can run on
# one OPENROUTER_API_KEY (scripts/run_evals.py --via-openrouter). Logs record the
# model string actually used; analysis maps both spellings to the same label.

openrouter_provider:
  require_parameters: true
  quantizations: [bf16, fp16, fp8]

# epochs: repeats per sample. Allocated after the pilot: the four frontier
# models sat at 0% violations and are expensive, so 1 epoch; every other model
# is cheap and either violates or sits near the floor, so more epochs for power
# (planned 3; cut to 2 during the run because Docker container churn saturated
# the laptop and 3 would have taken ~7 hours; see docs/DESIGN.md).
default_epochs: 2

groups:
  anthropic:
    - {model: anthropic/claude-opus-5-5, openrouter: anthropic/claude-opus-5.5, label: Claude Opus 5.5, family: Anthropic, reasoning: true, epochs: 1}
    - {model: anthropic/claude-sonnet-5, openrouter: anthropic/claude-sonnet-5, label: Claude Sonnet 5, family: Anthropic, reasoning: true, epochs: 1}
    - {model: anthropic/claude-haiku-4-5, openrouter: anthropic/claude-haiku-4.5, label: Claude Haiku 4.5, family: Anthropic, reasoning: false}
  openai:
    - {model: openai/gpt-5.5, openrouter: openai/gpt-5.5, label: GPT-5.5, family: OpenAI, reasoning: true, epochs: 1}
    - {model: openai/gpt-5-mini, openrouter: openai/gpt-5-mini, label: GPT-5 mini, family: OpenAI, reasoning: true, epochs: 1}
    - {model: openai/gpt-4.1-mini, openrouter: openai/gpt-4.1-mini, label: GPT-4.1 mini, family: OpenAI, reasoning: false}
    - {model: openai/gpt-4o-mini, openrouter: openai/gpt-4o-mini, label: GPT-4o mini, family: OpenAI, reasoning: false}
  open:
    - {model: openrouter/qwen/qwen3-235b-a22b-2507, label: Qwen3 235B, family: Qwen, reasoning: false}
    # Qwen2.5-7B (used in v0) has no OpenRouter provider that reports bf16/fp16/fp8
    # weights with tool calling, so the small Qwen is Qwen3.5-9B (DeepInfra, bf16).
    - {model: openrouter/qwen/qwen3.5-9b, label: Qwen3.5 9B, family: Qwen, reasoning: true}
    - {model: openrouter/meta-llama/llama-3.3-70b-instruct, label: Llama 3.3 70B, family: Meta, reasoning: false}
    # Llama 3.1 8B was piloted and dropped: its only provider meeting the precision
    # constraint returned malformed tool calls almost every turn (docs/DESIGN.md).
    # - {model: openrouter/meta-llama/llama-3.1-8b-instruct, label: Llama 3.1 8B, family: Meta, reasoning: false}
    - {model: openrouter/deepseek/deepseek-v3.2, label: DeepSeek V3.2, family: DeepSeek, reasoning: false}
    - {model: openrouter/openai/gpt-oss-120b, label: gpt-oss-120b, family: OpenAI (open), reasoning: true}
    - {model: openrouter/mistralai/mistral-small-3.2-24b-instruct, label: Mistral Small 3.2, family: Mistral, reasoning: false}
