[project]
name = "policy-pressure"
version = "0.1.0"
description = "Inspect AI eval: does an agent's policy compliance survive persona and peer pressure?"
readme = "README.md"
authors = [
    { name = "Jessica Chen", email = "jessica@agihouse.org" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "inspect-ai>=0.3.271",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "statsmodels>=0.15.0",
]

[project.entry-points.inspect_ai]
policy_pressure = "policy_pressure._registry"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs/excerpts"]  # verbatim model transcripts

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]  # line length is the formatter's job; zips here are intentionally ragged

[tool.pytest.ini_options]
testpaths = ["tests"]
